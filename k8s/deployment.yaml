apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: production
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
        - name: starbucks
          image: shubhamsharma01/starbucks:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
